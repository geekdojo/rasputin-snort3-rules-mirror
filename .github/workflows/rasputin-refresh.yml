##
## rasputin-refresh.yml — add the current upstream Snort3 Community Rules tarball
## to the mirror, after verifying it.
##
## WHAT IT DOES (details and reasoning: README.md)
##   verify   (read-only)  fetch upstream twice; if that SHA is already mirrored,
##                          stop; otherwise run every check (layout, rule count,
##                          Snort load test in the latest stable firewall image)
##                          and hand the verified bytes to the publish job.
##   publish  (write)      create the immutable release sha256-<SHA> with the single
##                          asset snort3-community-rules.tar.gz, then prove the
##                          public download URL serves exactly those bytes.
##
## TRIGGERS
##   schedule           daily. Talos republishes about weekly, on its own schedule.
##   workflow_dispatch  by hand (Actions tab, or `gh workflow run`); set dry_run to
##                      verify without publishing.
##   pull_request       always a DRY RUN: every check runs against the real upstream
##                      tarball, even if it is already mirrored, and the log says
##                      what a real run would publish. Nothing is published.
##
## A failed check fails the run, names the check, and publishes nothing. It never
## deletes or overwrites a release.
##
name: rasputin-refresh

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify everything but publish nothing"
        type: boolean
        default: false
  pull_request:

permissions:
  contents: read

concurrency:
  # Real runs queue behind each other and are never cancelled, so two runs cannot
  # race to publish the same SHA. Pull-request dry runs are per-branch and cheap
  # to supersede.
  group: ${{ github.event_name == 'pull_request' && format('rasputin-refresh-pr-{0}', github.ref) || 'rasputin-refresh-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DRY_RUN: ${{ (github.event_name == 'pull_request' || inputs.dry_run) && '1' || '0' }}

jobs:
  verify:
    name: Verify upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.verify.outputs.sha256 }}
      verified: ${{ steps.verify.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        timeout-minutes: 5
        run: ./scripts/install-deps-ubuntu.sh

      - name: Run every check
        id: verify
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-upstream.sh "$RUNNER_TEMP/work"

      - name: Dry run — what a real run would publish
        if: env.DRY_RUN == '1' && steps.verify.outputs.verified == 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish.sh "$RUNNER_TEMP/work"

      - name: Hand the verified tarball to the publish job
        if: env.DRY_RUN != '1' && steps.verify.outputs.verified == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-tarball
          path: |
            ${{ runner.temp }}/work/snort3-community-rules.tar.gz
            ${{ runner.temp }}/work/sha256
            ${{ runner.temp }}/work/verification.env
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish mirror entry
    needs: verify
    if: github.event_name != 'pull_request' && needs.verify.outputs.verified == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Refuse a dry run
        # Belt and braces: the job-level `if` already excludes pull requests, and
        # the verify job only uploads when DRY_RUN is off.
        if: env.DRY_RUN == '1'
        run: |
          echo "::error::publish job reached with DRY_RUN=1"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The commit this run checked out (verify checked out the same github.sha).
      # publish.sh creates the tag here, not on whatever main points at when gh
      # runs, and fails if the tag lands anywhere else.
      - name: Record built commit
        id: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-tarball
          path: ${{ runner.temp }}/work

      - name: Publish sha256-${{ needs.verify.outputs.sha256 }}
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_REPO: ${{ github.repository }}
          VERIFIED_SHA: ${{ needs.verify.outputs.sha256 }}
          TARGET_SHA: ${{ steps.src.outputs.sha }}
        run: |
          # The artifact must describe the SHA the verify job reported.
          [ "$(head -n 1 "$RUNNER_TEMP/work/sha256")" = "$VERIFIED_SHA" ] || {
            echo "::error::artifact sha256 does not match the verify job's output ($VERIFIED_SHA)"
            exit 1
          }
          ./scripts/publish.sh "$RUNNER_TEMP/work"
